name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Placeholder values so the prerender (canonical URL, sitemap, portal links)
      # can run in CI. Real values are set in the Vercel project.
      - name: Build
        run: pnpm run build
        env:
          NUXT_SITE_URL: https://affiliate.example.com
          NUXT_PUBLIC_AFFILIATE_PORTAL_URL: https://portal.example.com
          NUXT_PUBLIC_AFFILIATE_TERMS_URL: https://example.com/affiliate-terms
          NUXT_PUBLIC_AFFILIATE_PRIVACY_URL: https://example.com/privacy
          NUXT_PUBLIC_AFFILIATE_EMAIL: affiliates@example.com
